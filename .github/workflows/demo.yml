name: Deploy website

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Test code
        run: npm run test

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      script-file: ${{ steps.publish.outputs.script-file }}

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Publish JS filename
        id: publish
        run: |
          script_file=$(find dist/assets -maxdepth 1 -type f -name '*.js' -printf '%f\n' | head -n 1)
          echo "script-file=$script_file" >> "$GITHUB_OUTPUT"
          echo "Detected JS file: $script_file"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files

      - name: Show downloaded files
        run: |
          echo "Files in current directory:"
          ls -la

          echo "All downloaded files:"
          find . -type f

      - name: Output filename
        run: echo "Generated JS file: ${{ needs.build.outputs.script-file }}"

      - name: Deploy
        run: echo "Deploying..."
